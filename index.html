<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLee Portfolio</title>
  <style>
    :root {
      --bg: #f6f4ee;
      --surface: #ffffff;
      --surface-soft: #ebe7dc;
      --ink: #1f211d;
      --muted: #676d61;
      --line: #d8d2c4;
      --shadow: 0 18px 44px rgba(44, 42, 34, 0.12);
      --green: #477463;
      --red: #c8583d;
      --blue: #3d6d8f;
      --violet: #6d6194;
      --gold: #a9732b;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
    }

    .page {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
    }

    header {
      padding: 38px 0 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.75rem;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      max-width: 640px;
      font-size: clamp(2.35rem, 5vw, 4.4rem);
      line-height: 0.94;
      letter-spacing: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
    }

    .site-corner {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.66);
      color: var(--muted);
      padding: 9px 12px;
      font-size: 0.8rem;
      font-weight: 850;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 18px 0 34px;
    }

    .nav a {
      text-decoration: none;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.55);
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
      display: grid;
      gap: 1px;
      min-width: 150px;
    }

    .nav a:hover,
    .nav a:focus-visible {
      background: var(--ink);
      color: #fff;
      outline: none;
    }

    .nav strong {
      color: var(--ink);
      font-size: 1rem;
    }

    .nav a:hover strong,
    .nav a:focus-visible strong {
      color: #fff;
    }

    .nav small {
      font-size: 0.72rem;
      font-weight: 750;
    }

    .project {
      --accent: var(--green);
      margin: 0 0 26px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .project-toolbar {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      display: flex;
      gap: 8px;
    }

    .mini-link {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--accent), #1f211d 20%);
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      padding: 7px 12px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 900;
      backdrop-filter: blur(10px);
    }

    .project-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(360px, 0.95fr);
      gap: 0;
      min-height: 460px;
    }

    .project-copy {
      padding: clamp(22px, 4vw, 42px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 26px;
      border-right: 1px solid var(--line);
    }

    .project-top {
      display: grid;
      gap: 18px;
    }

    h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 5vw, 5.8rem);
      line-height: 0.94;
      letter-spacing: 0;
    }

    .type {
      margin: 0;
      color: var(--accent);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.76rem;
    }

    .details {
      display: grid;
      gap: 14px;
      margin-top: 6px;
    }

    .detail {
      display: grid;
      gap: 4px;
    }

    .detail h3 {
      margin: 0;
      color: var(--ink);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .detail p {
      margin: 0;
      color: var(--muted);
      max-width: 64ch;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 2px 0 0;
      padding: 0;
      list-style: none;
    }

    .features li {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #faf8f2;
      color: var(--muted);
      padding: 6px 10px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 7px;
      border: 1px solid var(--ink);
      padding: 10px 14px;
      text-decoration: none;
      font-weight: 850;
      background: #fff;
      color: var(--ink);
    }

    .button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-1px);
      outline: 3px solid color-mix(in srgb, var(--accent), transparent 72%);
      outline-offset: 2px;
    }

    .preview {
      background: var(--surface-soft);
      min-height: 460px;
      padding: 24px;
      display: grid;
      gap: 14px;
      align-content: center;
    }

    .screenshot-carousel {
      height: 360px;
      border: 1px solid #bcb5a8;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 14px 34px rgba(35, 32, 26, 0.18);
      display: grid;
      grid-template-rows: 1fr auto;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.35;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    .dot.is-active {
      opacity: 1;
      transform: scale(1.25);
    }

    .shot-track {
      display: flex;
      overflow: hidden;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }

    .shot-track::-webkit-scrollbar {
      display: none;
    }

    .shot {
      flex: 0 0 100%;
      min-width: 100%;
      scroll-snap-align: start;
      background: #fff;
    }

    .shot img {
      display: block;
      width: 100%;
      height: 315px;
      object-fit: cover;
      object-position: top left;
    }

    .shot-dots {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: #f7f3eb;
      border-top: 1px solid #d7d0c0;
    }

    .github-icon {
      width: 20px;
      height: 20px;
      display: block;
      flex: 0 0 auto;
    }

    .arrow-icon {
      width: 14px;
      height: 14px;
      display: block;
    }

    .download-note {
      color: var(--muted);
      font-size: 0.82rem;
      margin: -12px 0 0;
      max-width: 42ch;
    }

    @media (max-width: 900px) {
      header,
      .project-grid {
        grid-template-columns: 1fr;
      }

      header {
        display: grid;
      }

      .project-copy {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .preview,
      .screenshot-carousel {
        min-height: 0;
      }

      .preview {
        padding: 18px;
      }
    }

    @media (max-width: 620px) {
      .page {
        width: min(100% - 24px, 1180px);
      }

      header {
        padding-top: 28px;
      }

      .screenshot-carousel {
        height: 245px;
      }

      .shot img {
        height: 201px;
      }

      .project-toolbar {
        position: static;
        padding: 14px 14px 0;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <p class="eyebrow">MLee Portfolio</p>
        <h1>Projects that solve real problems.</h1>
      </div>
      <div class="site-corner">5 projects • live previews</div>
    </header>

    <nav class="nav" id="nav" aria-label="Project navigation"></nav>
    <main id="projects"></main>

  </div>

  <script>
    const projects = [
      {
        id: "finish-fast",
        name: "FinishFast",
        repo: "finish_fast",
        type: "Workload and focus planner",
        accent: "#4f46e5",
        label: "Homework time planner",
        live: "https://finish-fast.vercel.app/",
        code: "https://github.com/MLee12345/finish_fast",
        screenshots: [
          { src: "assets/screenshots/finish-fast-budget.png", alt: "FinishFast bedtime budget and homework queue" },
          { src: "assets/screenshots/finish-fast-overrun-options.png", alt: "FinishFast overrun resolution options" },
          { src: "assets/screenshots/finish-fast-focus.png", alt: "FinishFast focus timer screen" },
          { src: "assets/screenshots/finish-fast-checkin.png", alt: "FinishFast focus check-in prompt" },
          { src: "assets/screenshots/finish-fast-completed.png", alt: "FinishFast completed task filter" }
        ],
        problem: "Students can underestimate how much time is left once homework, fixed commitments, deadlines, and bedtime collide.",
        solution: "FinishFast turns the evening into a live time budget with task duration, fixed commitments, buffer time, overrun warnings, and a focus timer.",
        proud: "The bedtime budget is the strong dynamic: it makes an invisible time crunch visible before it becomes a late-night surprise.",
        features: ["bedtime budget", "focus timer", "overrun alerts", "saved subjects"]
      },
      {
        id: "dopamine-live",
        name: "DopamineLive",
        repo: "dopamine_live",
        type: "Virtual ticketing and merch simulator",
        accent: "#10b981",
        label: "Virtual concert tickets",
        live: "https://dopamine-live.vercel.app/",
        code: "https://github.com/MLee12345/dopamine_live",
        screenshots: [
          { src: "assets/screenshots/dopamine-live-discover.png", alt: "DopamineLive concert discovery marketplace" },
          { src: "assets/screenshots/dopamine-live-seats.png", alt: "DopamineLive seat selection flow" },
          { src: "assets/screenshots/dopamine-live-checkout.png", alt: "DopamineLive checkout screen" },
          { src: "assets/screenshots/dopamine-live-profile.png", alt: "DopamineLive profile history screen" },
          { src: "assets/screenshots/dopamine-live-wallet.png", alt: "DopamineLive ticket wallet screen" }
        ],
        problem: "Ticketing sites make discovery, seats, scarcity, checkout, and merch feel intense, but prototypes rarely let people safely explore that full loop.",
        solution: "DopamineLive simulates a live-event marketplace where users browse shows, pick seats, claim virtual tickets, enter a stage, and buy virtual merch.",
        proud: "The experience has a complete arc: marketplace discovery, ticket wallet, stage mode, merch queue, and local-only checkout simulation.",
        features: ["seat maps", "virtual wallet", "stage mode", "merch queue"]
      },
      {
        id: "gsifter",
        name: "gSifter",
        repo: "gSifter",
        type: "Google Calendar assistant extension",
        accent: "#1a73e8",
        label: "Calendar email assistant",
        live: "assets/gsifter-demo.html",
        previewText: "Preview demo",
        code: "https://github.com/MLee12345/gSifter",
        download: "assets/gSifter-extension.zip",
        downloadNote: "Download gives you a ZIP for loading the Chrome extension manually; it does not install itself.",
        screenshots: [
          { src: "assets/screenshots/gsifter-calendar-sidebar.png", alt: "gSifter mock calendar with sidebar suggestions" },
          { src: "assets/screenshots/gsifter-add-event.png", alt: "gSifter adding a detected event to the mock calendar" },
          { src: "assets/screenshots/gsifter-chat-rules.png", alt: "gSifter chat rules beside mock calendar" },
          { src: "assets/screenshots/gsifter-fake-api-rule.png", alt: "gSifter fake API chat rule saved" },
          { src: "assets/screenshots/gsifter-settings.png", alt: "gSifter fake API settings panel" }
        ],
        problem: "Useful events can get buried in emails and calendar clutter, and manually turning them into clean calendar entries takes attention.",
        solution: "gSifter adds a sidebar to Google Calendar for detected event suggestions, chat-based filtering rules, connected accounts, and privacy settings.",
        proud: "It lives directly inside the scheduling context, with suggestions, rule tuning, account setup, API-key activation, and calendar targeting in one panel.",
        features: ["Chrome extension", "event suggestions", "rule chat", "privacy toggles"]
      },
      {
        id: "face-recall",
        name: "Face Recall",
        repo: "face_recall",
        type: "Memory game",
        accent: "#6366f1",
        label: "Name memory game",
        live: "https://face-recall.vercel.app/",
        code: "https://github.com/MLee12345/face_recall",
        screenshots: [
          { src: "assets/screenshots/face-recall-welcome.png", alt: "Face Recall welcome screen" },
          { src: "assets/screenshots/face-recall-decks.png", alt: "Face Recall deck management screen" },
          { src: "assets/screenshots/face-recall-game.png", alt: "Face Recall quiz mode" },
          { src: "assets/screenshots/face-recall-match.png", alt: "Face Recall matching mode" },
          { src: "assets/screenshots/face-recall-leaderboard.png", alt: "Face Recall leaderboard screen" }
        ],
        problem: "Face recognition is a useful social skill, but practice tools can feel clinical instead of inviting.",
        solution: "Face Recall frames recognition as a card-based memory game with account states, profile flow, theme settings, and game navigation.",
        proud: "The app keeps the practice lightweight and approachable while still feeling like a complete little product.",
        features: ["face cards", "theme controls", "drawer nav", "profile flow"]
      },
      {
        id: "route-us",
        name: "RouteUs",
        repo: "route_us",
        type: "Carpool coordination tool",
        accent: "#0284c7",
        label: "Carpool schedule tool",
        live: "https://route-us.vercel.app/",
        code: "https://github.com/MLee12345/route_us",
        screenshots: [
          { src: "assets/screenshots/route-us-dashboard.png", alt: "RouteUs dashboard with carpool group" },
          { src: "assets/screenshots/route-us-group.png", alt: "RouteUs group schedule calendar" },
          { src: "assets/screenshots/route-us-availability.png", alt: "RouteUs availability editing screen" },
          { src: "assets/screenshots/route-us-profile.png", alt: "RouteUs profile settings screen" },
          { src: "assets/screenshots/route-us-dark.png", alt: "RouteUs dark mode dashboard" }
        ],
        problem: "Carpool groups need to coordinate kids, seats, availability, route details, and updates without spreading the plan across texts.",
        solution: "RouteUs gives families shared groups with join codes, profiles, availability editing, driver/rider views, week schedules, and group chat.",
        proud: "The group page combines the practical pieces in one place: schedule, members, rider details, destination notes, and chat.",
        features: ["group codes", "week schedule", "driver roles", "group chat"]
      }
    ];

    function arrowIcon() {
      return `<svg class="arrow-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg>`;
    }

    function githubIcon() {
      return `<svg class="github-icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.38 7.86 10.9.58.1.79-.25.79-.56v-2.02c-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.27-5.23-5.67 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.16 1.18.92-.26 1.9-.38 2.87-.39.98 0 1.96.13 2.88.39 2.19-1.49 3.15-1.18 3.15-1.18.63 1.58.24 2.75.12 3.04.74.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.38-5.25 5.66.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>`;
    }

    function previewMarkup(project) {
      return `
        <div class="screenshot-carousel" data-carousel="${project.id}" aria-label="${project.name} screenshots">
          <div class="shot-track">
            ${project.screenshots.map((shot, imageIndex) => `
              <figure class="shot" id="${project.id}-shot-${imageIndex}">
                <img src="${shot.src}" alt="${shot.alt}" loading="lazy">
              </figure>
            `).join("")}
          </div>
          <div class="shot-dots" aria-label="${project.name} screenshot pages">
            ${project.screenshots.map((_, imageIndex) => `<button class="dot ${imageIndex === 0 ? "is-active" : ""}" type="button" data-slide="${imageIndex}" aria-label="Show screenshot ${imageIndex + 1}"></button>`).join("")}
          </div>
        </div>`;
    }

    function render() {
      const nav = document.getElementById("nav");
      const mount = document.getElementById("projects");

      nav.innerHTML = projects.map(project => `<a href="#${project.id}"><strong>${project.name}</strong><small>${project.label}</small></a>`).join("");

      mount.innerHTML = projects.map((project, index) => `
        <article class="project" id="${project.id}" style="--accent:${project.accent}">
          <div class="project-toolbar">
            <a class="mini-link" href="${project.live}" target="_blank" rel="noreferrer">${project.previewText || "Preview"} ${arrowIcon()}</a>
          </div>
          <div class="project-grid">
            <section class="project-copy">
              <div class="project-top">
                <div>
                  <p class="type">${project.type}</p>
                  <h2>${project.name}</h2>
                </div>
                <div class="details">
                  <div class="detail">
                    <h3>Problem</h3>
                    <p>${project.problem}</p>
                  </div>
                  <div class="detail">
                    <h3>How it solves it</h3>
                    <p>${project.solution}</p>
                  </div>
                  <div class="detail">
                    <h3>Feature I am proud of</h3>
                    <p>${project.proud}</p>
                  </div>
                </div>
                <ul class="features">
                  ${project.features.map(feature => `<li>${feature}</li>`).join("")}
                </ul>
              </div>
              <div class="actions">
                ${project.download ? `<a class="button primary" href="${project.download}" download>Download gSifter</a>` : `<a class="button primary" href="${project.live}" target="_blank" rel="noreferrer">Open project ${arrowIcon()}</a>`}
                <a class="button" href="${project.code}" target="_blank" rel="noreferrer" title="View code on GitHub" aria-label="View ${project.name} code on GitHub">See in ${githubIcon()}${arrowIcon()}</a>
              </div>
              ${project.downloadNote ? `<p class="download-note">${project.downloadNote}</p>` : ""}
            </section>
            <section class="preview">
              ${previewMarkup(project)}
            </section>
          </div>
        </article>
      `).join("");
    }

    render();

    document.querySelectorAll(".screenshot-carousel").forEach((carousel) => {
      const track = carousel.querySelector(".shot-track");
      const dots = Array.from(carousel.querySelectorAll(".dot"));
      let activeSlide = 0;
      const updateDots = () => {
        dots.forEach((dot, index) => dot.classList.toggle("is-active", index === activeSlide));
      };

      dots.forEach((dot, index) => {
        dot.addEventListener("click", () => {
          activeSlide = index;
          track.scrollTo({ left: index * track.clientWidth, behavior: "smooth" });
          updateDots();
        });
      });
      updateDots();
    });
  </script>
</body>
</html>
