<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLee Portfolio</title>
  <style>
    :root {
      --bg: #f6f4ee;
      --surface: #ffffff;
      --surface-soft: #ebe7dc;
      --ink: #1f211d;
      --muted: #676d61;
      --line: #d8d2c4;
      --shadow: 0 18px 44px rgba(44, 42, 34, 0.12);
      --green: #477463;
      --red: #c8583d;
      --blue: #3d6d8f;
      --violet: #6d6194;
      --gold: #a9732b;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
    }

    .page {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
    }

    header {
      padding: 42px 0 28px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.75rem;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      max-width: 780px;
      font-size: clamp(3.2rem, 8vw, 7.8rem);
      line-height: 0.9;
      letter-spacing: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
    }

    .intro {
      max-width: 370px;
      color: var(--muted);
      font-size: 1rem;
      margin: 0;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 18px 0 34px;
    }

    .nav a {
      text-decoration: none;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .nav a:hover,
    .nav a:focus-visible {
      background: var(--ink);
      color: #fff;
      outline: none;
    }

    .project {
      --accent: var(--green);
      margin: 0 0 26px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .project-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(360px, 0.95fr);
      gap: 0;
      min-height: 460px;
    }

    .project-copy {
      padding: clamp(22px, 4vw, 42px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 26px;
      border-right: 1px solid var(--line);
    }

    .project-top {
      display: grid;
      gap: 18px;
    }

    .project-number {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 5vw, 5.8rem);
      line-height: 0.94;
      letter-spacing: 0;
    }

    .type {
      margin: 0;
      color: var(--accent);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.76rem;
    }

    .details {
      display: grid;
      gap: 14px;
      margin-top: 6px;
    }

    .detail {
      display: grid;
      gap: 4px;
    }

    .detail h3 {
      margin: 0;
      color: var(--ink);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .detail p {
      margin: 0;
      color: var(--muted);
      max-width: 64ch;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 2px 0 0;
      padding: 0;
      list-style: none;
    }

    .features li {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #faf8f2;
      color: var(--muted);
      padding: 6px 10px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 7px;
      border: 1px solid var(--ink);
      padding: 10px 14px;
      text-decoration: none;
      font-weight: 850;
      background: #fff;
      color: var(--ink);
    }

    .button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-1px);
      outline: 3px solid color-mix(in srgb, var(--accent), transparent 72%);
      outline-offset: 2px;
    }

    .preview {
      background: var(--surface-soft);
      min-height: 460px;
      padding: 24px;
      display: grid;
      gap: 14px;
      align-content: center;
    }

    .browser-frame {
      height: 320px;
      border: 1px solid #bcb5a8;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 14px 34px rgba(35, 32, 26, 0.18);
    }

    .browser-bar {
      height: 30px;
      background: #eee9df;
      border-bottom: 1px solid #cfc7b8;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.9;
    }

    .frame-body {
      height: calc(100% - 30px);
      background: #fff;
      overflow: hidden;
      position: relative;
    }

    .frame-body iframe {
      width: 1440px;
      height: 900px;
      border: 0;
      transform: scale(0.245);
      transform-origin: top left;
      pointer-events: none;
    }

    .extension-preview {
      height: 100%;
      padding: 18px;
      background:
        linear-gradient(90deg, #f8fafd 0 60%, #ffffff 60% 100%);
      display: grid;
      grid-template-columns: 1fr 210px;
      gap: 16px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      align-content: start;
    }

    .event-block {
      min-height: 44px;
      border-left: 5px solid #1a73e8;
      background: #e8f0fe;
      border-radius: 6px;
    }

    .sidebar-mock {
      border: 1px solid #dadce0;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
      box-shadow: -8px 0 22px rgba(26, 115, 232, 0.12);
    }

    .tabs {
      height: 34px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid #dadce0;
      color: #5f6368;
      font-size: 0.58rem;
      font-weight: 850;
      text-align: center;
    }

    .tabs span {
      display: grid;
      place-items: center;
    }

    .suggestions {
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .suggestion {
      min-height: 42px;
      border: 1px solid #dadce0;
      background: #f8fbff;
      border-radius: 7px;
    }

    .preview-caption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .preview-caption strong {
      color: var(--ink);
    }

    @media (max-width: 900px) {
      header,
      .project-grid {
        grid-template-columns: 1fr;
      }

      .project-copy {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .preview,
      .browser-frame {
        min-height: 0;
      }

      .preview {
        padding: 18px;
      }
    }

    @media (max-width: 620px) {
      .page {
        width: min(100% - 24px, 1180px);
      }

      header {
        padding-top: 28px;
      }

      .browser-frame {
        height: 245px;
      }

      .frame-body iframe {
        transform: scale(0.18);
      }

      .extension-preview {
        grid-template-columns: 1fr;
      }

      .sidebar-mock {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <p class="eyebrow">MLee Portfolio</p>
        <h1>Useful apps, clearly shown.</h1>
      </div>
      <p class="intro">A readable portfolio of five projects, with real previews, plain-language descriptions, standout features, and links that stay relative to wherever this site is hosted.</p>
    </header>

    <nav class="nav" id="nav" aria-label="Project navigation"></nav>
    <main id="projects"></main>

  </div>

  <script>
    const projects = [
      {
        id: "finish-fast",
        name: "FinishFast",
        repo: "finish_fast",
        type: "Workload and focus planner",
        accent: "#4f46e5",
        preview: "../finish_fast/index.html",
        code: "https://github.com/MLee12345/finish_fast",
        problem: "Students can underestimate how much time is left once homework, fixed commitments, deadlines, and bedtime collide.",
        solution: "FinishFast turns the evening into a live time budget with task duration, fixed commitments, buffer time, overrun warnings, and a focus timer.",
        proud: "The bedtime budget is the strong dynamic: it makes an invisible time crunch visible before it becomes a late-night surprise.",
        features: ["bedtime budget", "focus timer", "overrun alerts", "saved subjects"]
      },
      {
        id: "dopamine-live",
        name: "DopamineLive",
        repo: "dopamine_live",
        type: "Virtual ticketing and merch simulator",
        accent: "#10b981",
        preview: "../dopamine_live/index.html",
        code: "https://github.com/MLee12345/dopamine_live",
        problem: "Ticketing sites make discovery, seats, scarcity, checkout, and merch feel intense, but prototypes rarely let people safely explore that full loop.",
        solution: "DopamineLive simulates a live-event marketplace where users browse shows, pick seats, claim virtual tickets, enter a stage, and buy virtual merch.",
        proud: "The experience has a complete arc: marketplace discovery, ticket wallet, stage mode, merch queue, and local-only checkout simulation.",
        features: ["seat maps", "virtual wallet", "stage mode", "merch queue"]
      },
      {
        id: "gsifter",
        name: "gSifter",
        repo: "gSifter",
        type: "Google Calendar assistant extension",
        accent: "#1a73e8",
        preview: null,
        code: "https://github.com/MLee12345/gSifter",
        download: "assets/gSifter-extension.zip",
        problem: "Useful events can get buried in emails and calendar clutter, and manually turning them into clean calendar entries takes attention.",
        solution: "gSifter adds a sidebar to Google Calendar for detected event suggestions, chat-based filtering rules, connected accounts, and privacy settings.",
        proud: "It lives directly inside the scheduling context, with suggestions, rule tuning, account setup, API-key activation, and calendar targeting in one panel.",
        features: ["Chrome extension", "event suggestions", "rule chat", "privacy toggles"]
      },
      {
        id: "face-recall",
        name: "Face Recall",
        repo: "face_recall",
        type: "Memory game",
        accent: "#6366f1",
        preview: "../face_recall/index.html",
        code: "https://github.com/MLee12345/face_recall",
        problem: "Face recognition is a useful social skill, but practice tools can feel clinical instead of inviting.",
        solution: "Face Recall frames recognition as a card-based memory game with account states, profile flow, theme settings, and game navigation.",
        proud: "The app keeps the practice lightweight and approachable while still feeling like a complete little product.",
        features: ["face cards", "theme controls", "drawer nav", "profile flow"]
      },
      {
        id: "route-us",
        name: "RouteUs",
        repo: "route_us",
        type: "Carpool coordination tool",
        accent: "#0284c7",
        preview: "../route_us/index.html",
        code: "https://github.com/MLee12345/route_us",
        problem: "Carpool groups need to coordinate kids, seats, availability, route details, and updates without spreading the plan across texts.",
        solution: "RouteUs gives families shared groups with join codes, profiles, availability editing, driver/rider views, week schedules, and group chat.",
        proud: "The group page combines the practical pieces in one place: schedule, members, rider details, destination notes, and chat.",
        features: ["group codes", "week schedule", "driver roles", "group chat"]
      }
    ];

    function projectUrl(project) {
      return `../${project.repo}/`;
    }

    function arrowIcon() {
      return `<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg>`;
    }

    function previewMarkup(project) {
      if (!project.preview) {
        return `
          <div class="browser-frame" aria-label="gSifter interface preview">
            <div class="browser-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            <div class="frame-body">
              <div class="extension-preview">
                <div class="calendar-grid">
                  ${Array.from({ length: 12 }, () => `<div class="event-block"></div>`).join("")}
                </div>
                <div class="sidebar-mock">
                  <div class="tabs"><span>Suggestions</span><span>Chat</span><span>Settings</span></div>
                  <div class="suggestions">
                    <div class="suggestion"></div>
                    <div class="suggestion"></div>
                    <div class="suggestion"></div>
                    <div class="suggestion"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>`;
      }

      return `
        <div class="browser-frame" aria-label="${project.name} live preview">
          <div class="browser-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          <div class="frame-body">
            <iframe src="${project.preview}" title="${project.name} preview" loading="lazy" tabindex="-1"></iframe>
          </div>
        </div>`;
    }

    function render() {
      const nav = document.getElementById("nav");
      const mount = document.getElementById("projects");

      nav.innerHTML = projects.map(project => `<a href="#${project.id}">${project.name}</a>`).join("");

      mount.innerHTML = projects.map((project, index) => `
        <article class="project" id="${project.id}" style="--accent:${project.accent}">
          <div class="project-grid">
            <section class="project-copy">
              <div class="project-top">
                <span class="project-number">${index + 1}</span>
                <div>
                  <p class="type">${project.type}</p>
                  <h2>${project.name}</h2>
                </div>
                <div class="details">
                  <div class="detail">
                    <h3>Problem</h3>
                    <p>${project.problem}</p>
                  </div>
                  <div class="detail">
                    <h3>How it solves it</h3>
                    <p>${project.solution}</p>
                  </div>
                  <div class="detail">
                    <h3>Feature I am proud of</h3>
                    <p>${project.proud}</p>
                  </div>
                </div>
                <ul class="features">
                  ${project.features.map(feature => `<li>${feature}</li>`).join("")}
                </ul>
              </div>
              <div class="actions">
                ${project.download ? `<a class="button primary" href="${project.download}" download>Download gSifter</a>` : `<a class="button primary" href="${projectUrl(project)}" target="_blank" rel="noreferrer">Open project ${arrowIcon()}</a>`}
                <a class="button" href="${project.code}" target="_blank" rel="noreferrer">View code ${arrowIcon()}</a>
              </div>
            </section>
            <section class="preview">
              ${previewMarkup(project)}
              <div class="preview-caption">
                <span><strong>Thumbnail:</strong> embedded project preview</span>
                <span>${project.download ? "Extension download included" : "Relative project link"}</span>
              </div>
            </section>
          </div>
        </article>
      `).join("");
    }

    render();
  </script>
</body>
</html>
