<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gSifter Demo Calendar</title>
  <style>
    :root {
      --blue: #1a73e8;
      --line: #dadce0;
      --text: #202124;
      --muted: #5f6368;
      --bg: #f8fafd;
      --green: #188038;
      --yellow: #f9ab00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      overflow: hidden;
      transition: grid-template-columns 220ms ease;
    }

    body.sidebar-closed {
      grid-template-columns: minmax(0, 1fr) 0px;
    }

    .calendar {
      display: grid;
      grid-template-rows: auto auto 1fr;
      min-width: 0;
      background: #fff;
    }

    .topbar {
      min-height: 68px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.35rem;
      font-weight: 700;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: conic-gradient(from 210deg, #4285f4, #34a853, #fbbc04, #ea4335, #4285f4);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
    }

    .days {
      display: grid;
      grid-template-columns: 70px repeat(7, 1fr);
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .day {
      min-height: 76px;
      border-left: 1px solid var(--line);
      padding: 12px;
      display: grid;
      align-content: center;
      justify-items: center;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 750;
    }

    .day strong {
      margin-top: 4px;
      color: var(--text);
      font-size: 1.35rem;
    }

    .time-label {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: 70px repeat(7, 1fr);
      grid-template-rows: repeat(9, 1fr);
      min-height: 0;
    }

    .hour {
      border-bottom: 1px solid #edf0f2;
      padding-top: 8px;
      text-align: center;
      color: var(--muted);
      font-size: 0.74rem;
    }

    .cell {
      border-left: 1px solid #edf0f2;
      border-bottom: 1px solid #edf0f2;
      position: relative;
    }

    .event {
      position: absolute;
      left: 8px;
      right: 8px;
      border-radius: 9px;
      padding: 8px;
      color: #174ea6;
      background: #d2e3fc;
      border-left: 5px solid var(--blue);
      font-size: 0.78rem;
      font-weight: 750;
      box-shadow: 0 3px 12px rgba(26, 115, 232, 0.12);
    }

    .event.green {
      color: #0d652d;
      background: #ceead6;
      border-left-color: var(--green);
    }

    .event.yellow {
      color: #7a4f00;
      background: #feefc3;
      border-left-color: var(--yellow);
    }

    .sidebar-frame {
      width: 100%;
      min-width: 0;
      height: 100vh;
      border: 0;
      border-left: 1px solid var(--line);
      box-shadow: -12px 0 36px rgba(60, 64, 67, 0.12);
      background: #f8f9fa;
      transition: opacity 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    body.sidebar-closed .sidebar-frame {
      opacity: 0;
      pointer-events: none;
      border-left-color: transparent;
      box-shadow: none;
    }

    .gsifter-trigger {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 5;
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      background: transparent;
      padding: 0;
      display: flex;
      align-items: center;
      place-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(18, 181, 136, 0.4);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .gsifter-trigger:hover,
    .gsifter-trigger:focus-visible {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(18, 181, 136, 0.5);
      outline: none;
    }

    .gsifter-trigger svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .gs-badge-dot {
      position: absolute;
      top: 0;
      right: 0;
      width: 12px;
      height: 12px;
      background-color: #ea4335;
      border: 2px solid #ffffff;
      border-radius: 50%;
      display: block;
    }

    @media (max-width: 900px) {
      body {
        grid-template-columns: minmax(0, 1fr);
        overflow: auto;
      }

      .sidebar-frame {
        min-height: 680px;
        height: 72vh;
      }

      body.sidebar-closed {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
</head>
<body>
  <section class="calendar" aria-label="Mock Google Calendar">
    <div class="topbar">
      <div class="brand"><span class="brand-mark">31</span> Calendar</div>
      <div class="top-actions">
        <span class="chip">Week</span>
        <span class="chip">Fake API connected</span>
      </div>
    </div>
    <div class="days">
      <div class="time-label">GMT-8</div>
      <div class="day">Mon<strong>9</strong></div>
      <div class="day">Tue<strong>10</strong></div>
      <div class="day">Wed<strong>11</strong></div>
      <div class="day">Thu<strong>12</strong></div>
      <div class="day">Fri<strong>13</strong></div>
      <div class="day">Sat<strong>14</strong></div>
      <div class="day">Sun<strong>15</strong></div>
    </div>
    <div class="grid" id="calendarGrid"></div>
  </section>

  <iframe class="sidebar-frame" id="gsifterSidebar" src="gsifter-real/sidebar.html" title="gSifter sidebar preview"></iframe>
  <button class="gsifter-trigger" id="gsifterTrigger" type="button" aria-label="Close gSifter sidebar" aria-expanded="true">
    <svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">
      <defs>
        <linearGradient id="gs-trigger-gradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#1a73e8"/>
          <stop offset="1" stop-color="#12b588"/>
        </linearGradient>
      </defs>
      <circle fill="url(#gs-trigger-gradient)" cx="32" cy="32" r="32"/>
      <path fill="#ffffff" fill-opacity="0.3" d="M16 18.15C16 17.32 16.67 16.65 17.5 16.65H46.5C47.33 16.65 48 18.15 48 18.15C48 18.44 47.92 18.72 47.76 18.96L37 35.61V46.65C37 47.15 36.75 47.62 36.33 47.89L27.83 53.45C26.97 54.01 25.82 53.77 25.26 52.92C24.93 52.41 24.75 51.81 24.75 51.19V35.62L16.24 18.97C16.08 18.73 16 18.45 16 18.15Z"/>
      <text fill="#ffffff" font-family="Helvetica-Bold, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" x="14.25" y="42.34">gS</text>
      <path fill="#ffd034" d="M48 9C48 12.31 50.69 15 54 15C50.69 15 48 17.69 48 21C48 17.69 45.31 15 42 15C45.31 15 48 12.31 48 9Z"/>
    </svg>
    <span class="gs-badge-dot" id="gsifterUnreadDot"></span>
  </button>

  <script>
    const grid = document.getElementById("calendarGrid");
    const gsifterTrigger = document.getElementById("gsifterTrigger");
    const gsifterSidebar = document.getElementById("gsifterSidebar");
    const hours = ["8 AM", "9 AM", "10 AM", "11 AM", "12 PM", "1 PM", "2 PM", "3 PM", "4 PM"];
    const placement = {
      "Study group with Nora": [8, 2, ""],
      "Math review session": [6, 4, "green"],
      "Volunteer shift": [2, 5, "yellow"],
    };

    hours.forEach((hour, row) => {
      const hourLabel = document.createElement("div");
      hourLabel.className = "hour";
      hourLabel.textContent = hour;
      grid.append(hourLabel);

      for (let col = 0; col < 7; col += 1) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.row = row;
        cell.dataset.col = col;
        grid.append(cell);
      }
    });

    function addEvent(title, row, col, className = "") {
      const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
      if (!cell || cell.querySelector(`[data-title="${CSS.escape(title)}"]`)) return;
      const event = document.createElement("div");
      event.className = `event ${className}`;
      event.dataset.title = title;
      event.style.top = "8px";
      event.style.minHeight = row % 2 ? "54px" : "42px";
      event.textContent = title;
      cell.append(event);
    }

    addEvent("Chem lab", 1, 1);
    addEvent("English essay check-in", 3, 2, "green");
    addEvent("Soccer practice", 7, 3, "yellow");
    addEvent("Family dinner", 8, 4);

    function setSidebarOpen(isOpen) {
      document.body.classList.toggle("sidebar-closed", !isOpen);
      gsifterTrigger.setAttribute("aria-expanded", String(isOpen));
      gsifterTrigger.setAttribute("aria-label", `${isOpen ? "Close" : "Open"} gSifter sidebar`);
    }

    gsifterTrigger.addEventListener("click", () => {
      setSidebarOpen(document.body.classList.contains("sidebar-closed"));
    });

    window.addEventListener("message", (event) => {
      const data = event.data || {};

      if (data.action === "GET_MY_CALENDARS") {
        gsifterSidebar.contentWindow.postMessage({
          action: "MY_CALENDARS_RESPONSE",
          calendars: [
            { id: "school", name: "School Calendar" },
            { id: "personal", name: "Personal Calendar" }
          ]
        }, "*");
      }

      if (data.action === "DIRECT_ADD_EVENT") {
        const title = data.eventData?.title || "New event";
        const spot = placement[title] || [5, 3, ""];
        addEvent(title, spot[0], spot[1], spot[2]);
        gsifterSidebar.contentWindow.postMessage({
          action: "EVENT_ADDED_SUCCESS",
          eventId: data.eventData?.id
        }, "*");
      }

      if (data.action === "CLOSE_GSIFTER_SIDEBAR") {
        setSidebarOpen(false);
      }
    });
  </script>
</body>
</html>
